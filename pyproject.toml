[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "credit-risk-lab"
version = "0.12.0"
description = "Credit risk modeling and decisioning lab"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["pydantic>=2.8,<3", "PyYAML>=6.0.2,<7", "numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2", "xgboost>=2.1,<4", "joblib>=1.4,<2", "scipy>=1.11,<2", "matplotlib>=3.8,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
tracking = ["mlflow-skinny>=3.0,<4", "SQLAlchemy>=2,<3", "alembic>=1.14,<2"]

[project.scripts]
credit-risk-lab = "credit_risk.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1", "duckdb>=1.2,<2", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk"]

[tool.hatch.build.targets.sdist]
include = ["/README.md", "/data/README.md", "/src", "/configs", "/docs", "/sql", "/tests", "/scripts", "/reports", "/pyproject.toml", "/uv.lock", "/.python-version", "/Makefile", "/Dockerfile", "/.dockerignore", "/.gitattributes", "/.github/workflows/ci.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py", "api/**/*.py"]
exclude = ["scripts/check_phase1.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
link-mode = "copy"
