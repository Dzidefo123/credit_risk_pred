[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "credit-risk-lab"
version = "0.3.0"
description = "Credit risk modeling and decisioning lab"
readme = "docs/architecture.md"
requires-python = ">=3.11,<3.15"
dependencies = ["pydantic>=2.8,<3", "PyYAML>=6.0.2,<7", "numpy>=1.26,<3", "pandas>=2.2,<4"]

[project.scripts]
credit-risk-lab = "credit_risk.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
link-mode = "copy"
